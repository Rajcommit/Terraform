#cloud-config

#Hostname and timezone configuration
hostname: miniserver-${instance_number}
timezone: Asia/Kolkata

#Package update and installation
package_update: true
package_upgrade: true

packages:
  - docker.io
  - aws-cli
  - httpd
  - amazon-efs-utils
  - jq
  - htop
  - cronie

runcmd:
#Creating Directories for mounting EFS
 # Create directories
  - mkdir -p /mnt/efs
  - mkdir -p /var/backups
  - mkdir -p /var/www/html

# Mount EFS
mounts:
  - mount -t nfs4 ${efs_dns_name}:/ /mnt/efs
  - [ "${efs_dns_name}:/", /mnt/efs, nfs4, "defaults,_netdev", "0", "0" ]
  
  # Docker setup
  - systemctl start docker
  - systemctl enable docker
  - usermod -aG docker ec2-user
  
  # ECR login and container deployment
  - aws ecr get-login-password --region ${aws_region} | docker login --username AWS --password-stdin ${ecr_registry}
  - docker pull ${ecr_registry}/miniserver-node-app:latest
  - docker run -d -p 3000:3000 --name miniserver-app --restart unless-stopped ${ecr_registry}/miniserver-node-app:latest
  
  # Apache setup
  - systemctl start httpd
  - systemctl enable httpd
  
  # Run first backup
  - /usr/local/bin/backup.sh
  
  # Log completion
  - echo "$(date): Cloud-init setup complete!" | tee -a /var/log/cloud-init-custom.log





# Write files
write_files:
  # Apache index page
  - path: /var/www/html/index.html
    content: |
      <html>
      <head>
        <title>MiniServer Instance ${instance_number}</title>
        <style>
          body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
          }
          .container { 
            background: rgba(255,255,255,0.1); 
            padding: 30px; 
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
          }
          h1 { color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
          .info { background: rgba(255,255,255,0.2); padding: 10px; margin: 10px 0; border-radius: 5px; }
        </style>
      </head>
      <body>
        <div class="container">
          <h1>🚀 MiniServer Instance ${instance_number}</h1>
          <div class="info"><strong>Environment:</strong> ${environment}</div>
          <div class="info"><strong>Region:</strong> ${aws_region}</div>
          <div class="info"><strong>Backup Enabled:</strong> ✅ Yes</div>
          <div class="info"><strong>Status:</strong> 🟢 Running</div>
        </div>
      </body>
      </html>
    permissions: '0644'
    owner: root:root


# Backup script
  - path: /usr/local/bin/backup.sh
    content: |
      #!/bin/bash
      set -euo pipefail
      
      BACKUP_DIR="/var/backups"
      S3_BUCKET="${s3_bucket_name}"
      DATE=$(date +%Y-%m-%d-%H-%M-%S)
      INSTANCE_ID=$(ec2-metadata --instance-id | cut -d ' ' -f 2)
      BACKUP_FILE="backup-$DATE.tar.gz"
      
      echo "$(date): Starting backup..." | tee -a /var/log/backup.log
      
      # Create backup
      tar -czf $BACKUP_DIR/$BACKUP_FILE \
        /var/www/html \
        /mnt/efs \
        /var/log/httpd \
        /etc/httpd \
        2>/dev/null || true
      
      # Upload to S3
      if aws s3 cp $BACKUP_DIR/$BACKUP_FILE s3://$S3_BUCKET/$INSTANCE_ID/ --region ${aws_region}; then
        BACKUP_SIZE=$(du -h $BACKUP_DIR/$BACKUP_FILE | cut -f1)
        echo "$(date): SUCCESS - $BACKUP_FILE ($BACKUP_SIZE) uploaded" | tee -a /var/log/backup.log
      else
        echo "$(date): FAILED - Upload failed" | tee -a /var/log/backup.log
        exit 1
      fi
      
      # Cleanup old backups (keep 7 days)
      find $BACKUP_DIR -name "backup-*.tar.gz" -mtime +7 -delete
      
      echo "$(date): Backup complete!" | tee -a /var/log/backup.log
    permissions: '0755'
    owner: root:root
  
# Cron job for backups
  - path: /etc/cron.d/backup
    content: |
      # Run backup daily at 2 AM
      0 2 * * * root /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1
    permissions: '0644'
    owner: root:root

# Final message
final_message: "MiniServer instance ${instance_number} is ready! Setup completed in $UPTIME seconds."