name: Terraform
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# defaults:
#   run:
#     working-directory: modules

jobs:
  #job number 1 : Prepare and Plan and Validate
  # NEW JOB: Call docker-build.yml workflow
  docker-build:
    name: Build Docker Image
    # Always run for Terraform pipeline events so apply has a fresh image on main pushes.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit

  # EXISTING JOB: Now depends on docker-build
  # terraform-init-format-validate:
  #   name: Init, Format & Validate
  #   runs-on: ubuntu-latest
  #   needs: [docker-build]
  #   if: always()  # Run even if docker-build was skipped
  #   env:
  #     TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN}}

  terraform-init-format-validate:
    name: Init, Format & Validate
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: always() && (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped')
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
      - name: Terraform Format
        #run: terraform fmt -write=true
        run: terraform fmt --recursive

      - name: Terraform Validate
        run: terraform validate

  #Job 2: Plan (depends on validate)
  terraform-plan:
    name: Terraform validate and plan
    runs-on: ubuntu-latest
    needs: terraform-init-format-validate
    if: always() && needs['terraform-init-format-validate'].result == 'success'
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  infracost-check:
    name: Cost Check
    runs-on: ubuntu-latest
    needs: [terraform-plan]
    if: always() && needs['terraform-plan'].result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY}}

      - name: Run Infracost
        working-directory: .
        run: |
          # Show full breakdown table 
          infracost breakdown  --path . --format table

          # chcek if cost exceeds threshold
          COST=$(infracost breakdown  --path . --format json  | jq -r '.totalMonthlyCost')
          echo "Total monthly cost: $COST "

          if (( $(echo "$COST > 10" | bc -l) )); then
            echo "Cost exceeds \$10 threshold"
          fi

  # Don't exit - just warn exit 1

  ### Terraform Apply
  terraform-apply:
    name: Terraform Apply
    needs: [docker-build, terraform-plan, infracost-check]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main'
      && github.event_name == 'push' 
      && needs['infracost-check'].result == 'success'  
      && needs['terraform-plan'].result == 'success' 
      && (needs['docker-build'].result == 'success' || needs['docker-build'].result == 'skipped')
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN}}

    steps:
      - name: Show Docker image that was built
        run: |
          echo "Docker image: ${{ needs['docker-build'].outputs.image_uri }}"
          echo "Image tag: ${{ needs['docker-build'].outputs.image_tag }}"
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform Init
        run: terraform init
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        #run: terraform apply -auto-approve tfplan

  ansible-configure:
    name: Configure with Ansible
    runs-on: ubuntu-latest
    needs: [docker-build, terraform-plan, infracost-check, terraform-apply]
    if: always() && needs['terraform-apply'].result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/myec2key.pem
          chmod 600 ~/.ssh/myec2key.pem

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Wait for instances to be ready
        run: sleep 60 # Adjust as needed

      - name: Run Ansible Playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/hosts.ini playbooks/setup-worker.yml
