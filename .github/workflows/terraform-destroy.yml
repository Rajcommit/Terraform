name: Terraform Destroy
on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to continue"
        required: true
        type: string
      reason:
        description: "Why are you destroying?"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-destroy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  safety-check:
    name: Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "You must type DESTROY to continue"
            exit 1
          fi
          echo "Confirmation validated"

  destroy-prepare:
    name: Terraform Destroy Prepare
    runs-on: ubuntu-latest
    needs: safety-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy Preview
        run: terraform plan -destroy

  destroy-apply:
    name: Terraform Destroy Apply (FINAL WARNING)
    runs-on: ubuntu-latest
    needs: destroy-prepare
    # environment: terraform-destroy  # Removed - using input confirmation instead
    if: github.event.inputs.confirm_destroy == 'DESTROY'

    steps:
      - name: Final Warning
        run: |
          echo "DESTROYING ALL INFRASTRUCTURE! THIS ACTION CANNOT BE UNDONE!"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Starting destruction in 10 seconds..."
          sleep 10
          echo "DESTRUCTION STARTING NOW "

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy Apply
        run: terraform destroy -auto-approve

        ##
