---
- name: Setup ELK Base (Docker)
  hosts: role_monitoring
  become: true

  tasks:
    - name: Create swap file
      command: dd if=/dev/zero of=/swapfile bs=1M count=2048
      args:
        creates: /swapfile

    - name: Set swap permissions
      file:
        path: /swapfile
        mode: "0600"

    - name: Make swap
      command: mkswap /swapfile
      changed_when: true

    - name: Enable swap
      command: swapon /swapfile
      ignore_errors: true

    - name: Add swap to fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile swap swap defaults 0 0"
        state: present

    - name: Set vm.max_map_count for Elasticsearch
      sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: true

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install docker-compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: Create ELK directory
      file:
        path: /opt/elk
        state: directory
        mode: "0755"
