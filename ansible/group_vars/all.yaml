---
# Project settings
project_name: miniserver
aws_region: ap-south-1

# Packages to install
packages_to_install:
  - docker
  - git
  - htop
  - vim
  - wget
  - amazon-efs-utils
  - jq
  - amazon-cloudwatch-agent 

# Docker settings
docker_users:
  - ec2-user

# Application settings
app_port: 3000
ecr_registry: "{{ lookup('env', 'ECR_REGISTRY') }}"